<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>relay</title>
<style>
/* ============================================================
   relay demo — design tokens
   light palette on bare :root; dark redefines tokens only,
   once under guarded media query, once under [data-theme=dark]
   ============================================================ */
:root{
  --ground:#EEF1F5; --surface:#FFFFFF; --surface2:#F5F7FA; --inset:#E9EDF2;
  --dot:#C9D2DC; --line:#DAE0E8; --line-strong:#C2CBD6; --edge:#AEB9C6;
  --text:#1B2430; --muted:#5F6D7E;
  --accent:#8F4F00; --accent-ink:#FFFFFF; --accent-soft:#F6E8D8; --ring:rgba(143,79,0,.22);
  --c-run:#155DB5;  --c-run-bg:#E1ECFA;
  --c-wait:#755A00; --c-wait-bg:#F4ECD2;
  --c-done:#087A42; --c-done-bg:#DEF2E6;
  --c-err:#B8322C;  --c-err-bg:#FAE3E1;
  --c-queue:#596779;--c-queue-bg:#E7EBF0;--c-cancel:#6B5B95;--c-cancel-bg:#ECE8F4;--c-cancel-g:#8B7BC4;
  --c-run-g:#3B82F6; --c-wait-g:#F59E0B; --c-done-g:#22C55E; --c-err-g:#EF4444; --c-queue-g:#94A3B8;
  --shadow-sm:0 1px 2px rgba(23,32,42,.08);
  --shadow-lg:0 8px 28px rgba(23,32,42,.18);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-micro:11px; --fs-small:12px; --fs-body:13px; --fs-title:14px; --fs-brand:15px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1116; --surface:#151B23; --surface2:#1B222C; --inset:#0B0E13;
    --dot:#2B3745; --line:#2A3543; --line-strong:#415062; --edge:#4A5A6E;
    --text:#DCE3EC; --muted:#94A2B3;
    --accent:#FFB454; --accent-ink:#171207; --accent-soft:#3A2C13; --ring:rgba(255,180,84,.25);
    --c-run:#4FA8FF;  --c-run-bg:#14283E;
    --c-wait:#E8B44C; --c-wait-bg:#33290F;
    --c-done:#57C77B; --c-done-bg:#123020;
    --c-err:#E5655E;  --c-err-bg:#391816;
    --c-queue:#8E9AAA;--c-queue-bg:#232C37;--c-cancel:#B9A9E0;--c-cancel-bg:#2A2340;--c-cancel-g:#9C8AC7;
    --c-run-g:#4FA8FF; --c-wait-g:#E8B44C; --c-done-g:#57C77B; --c-err-g:#E5655E; --c-queue-g:#8E9AAA;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-lg:0 8px 28px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#151B23; --surface2:#1B222C; --inset:#0B0E13;
  --dot:#2B3745; --line:#2A3543; --line-strong:#415062; --edge:#4A5A6E;
  --text:#DCE3EC; --muted:#94A2B3;
  --accent:#FFB454; --accent-ink:#171207; --accent-soft:#3A2C13; --ring:rgba(255,180,84,.25);
  --c-run:#4FA8FF;  --c-run-bg:#14283E;
  --c-wait:#E8B44C; --c-wait-bg:#33290F;
  --c-done:#57C77B; --c-done-bg:#123020;
  --c-err:#E5655E;  --c-err-bg:#391816;
  --c-queue:#8E9AAA;--c-queue-bg:#232C37;--c-cancel:#B9A9E0;--c-cancel-bg:#2A2340;--c-cancel-g:#9C8AC7;
  --c-run-g:#4FA8FF; --c-wait-g:#E8B44C; --c-done-g:#57C77B; --c-err-g:#E5655E; --c-queue-g:#8E9AAA;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 8px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ground); color:var(--text);
  font-family:var(--font-ui); font-size:var(--fs-body); line-height:1.5;
  overflow:hidden;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-run);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- status color system: one class, three usages ---------- */
.st-run   {--st:var(--c-run);  --st-bg:var(--c-run-bg);  --st-g:var(--c-run-g)}
.st-wait  {--st:var(--c-wait); --st-bg:var(--c-wait-bg); --st-g:var(--c-wait-g)}
.st-queue {--st:var(--c-queue);--st-bg:var(--c-queue-bg);--st-g:var(--c-queue-g)}
.st-done  {--st:var(--c-done); --st-bg:var(--c-done-bg); --st-g:var(--c-done-g)}
.st-err   {--st:var(--c-err);  --st-bg:var(--c-err-bg);  --st-g:var(--c-err-g)}
.st-closed{--st:var(--muted);  --st-bg:var(--surface2);  --st-g:var(--muted)}
.st-cancelled{--st:var(--c-cancel);--st-bg:var(--c-cancel-bg);--st-g:var(--c-cancel-g)}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:var(--fs-micro);font-weight:600;letter-spacing:.02em;
  padding:2px 8px;border-radius:999px;white-space:nowrap;
  background:var(--st-bg);color:var(--st);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--st-g);flex:none;display:inline-block}

/* ---------- app frame ---------- */
#app{
  display:grid;position:relative;
  grid-template-columns:var(--sbw,248px) 1fr var(--dw,296px);
  grid-template-rows:48px auto minmax(0,1fr) var(--chh,232px); /* 2행 = 상태 배너(없으면 0) */
  height:100vh;height:100dvh;
}

/* ---------- header ---------- */
header{
  grid-column:1/-1;
  display:flex;align-items:center;gap:16px;padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--line-strong);
}
.brand{display:flex;align-items:center;gap:8px;font-size:var(--fs-brand);font-weight:700;letter-spacing:-.01em}
.brand .mark{width:10px;height:10px;border-radius:3px;background:var(--accent);flex:none}
.hdr-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:30px;height:30px;border-radius:7px;cursor:pointer;position:relative;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--surface2)}

/* ---------- main 3-pane ---------- */
.sidebar{grid-row:3;grid-column:1}
.canvas{grid-row:3;grid-column:2;user-select:none;-webkit-user-select:none}
.detail{grid-row:3;grid-column:3}
.chat{grid-row:4;grid-column:1/-1}
/* 패널 정렬 (VSCode Panel Alignment): 전체/중앙/왼쪽/오른쪽 */
#app.pa-center .sidebar,#app.pa-right .sidebar{grid-row:3/5}
#app.pa-center .detail,#app.pa-left .detail{grid-row:3/5}
#app.pa-center .chat{grid-column:2/3}
#app.pa-left .chat{grid-column:1/3}
#app.pa-right .chat{grid-column:2/4}

/* VSCode식 패널 리사이즈 핸들 */
.rz{position:absolute;z-index:30;background:transparent;transition:background .15s}
.rz:hover,.rz.drag{background:var(--ring)}
.rz-sb{top:calc(48px + var(--bh,0px));bottom:var(--chh,232px);width:7px;left:calc(var(--sbw,248px) - 3px);cursor:col-resize}
.rz-dt{top:calc(48px + var(--bh,0px));bottom:var(--chh,232px);width:7px;right:calc(var(--dw,296px) - 3px);cursor:col-resize}
#app.pa-center .rz-sb,#app.pa-right .rz-sb{bottom:0}
#app.pa-center .rz-dt,#app.pa-left .rz-dt{bottom:0}
.rz-ch{left:0;right:0;top:-4px;height:8px;cursor:row-resize}

/* sidebar */
.sidebar{
  background:var(--surface);border-right:1px solid var(--line-strong);
  overflow-y:auto;padding:6px 0 16px;
}
.group{margin-bottom:4px}
.group-h{
  display:flex;align-items:center;gap:6px;
  padding:10px 14px 6px;border-bottom:1px solid var(--line);
  font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;color:var(--muted);
}
.group-h .cnt{margin-left:auto;font-weight:600}
.group-h.attn{color:var(--c-err)}
.s-item{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;cursor:pointer;
  padding:8px 14px 8px 12px;border:0;background:none;border-left:2px solid transparent;
}
.s-item:hover{background:var(--surface2)}
.s-item.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.s-item.rel{border-left-color:var(--accent)}
.s-item .dot{margin-top:5px}
.s-item .tt{font-size:var(--fs-body);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item .mm{font-size:var(--fs-micro);color:var(--muted)}
.s-item .txt{min-width:0;flex:1}
.s-item.closed{opacity:.55}
.group-empty{padding:6px 14px 8px;font-size:var(--fs-small);color:var(--muted)}

/* canvas */
.canvas{
  position:relative;overflow:hidden;background:var(--inset);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:22px 22px;cursor:grab;touch-action:none;
}
.canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:2400px;height:1600px;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5;transition:opacity .25s}
.edge.run{stroke:var(--c-run-g);stroke-dasharray:6 5;animation:flow 1s linear infinite}
.edge.queue{stroke:var(--c-queue-g);stroke-dasharray:2 5}
.edge.msg{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:none}
@keyframes flow{to{stroke-dashoffset:-11}}

.gw{
  position:absolute;width:210px;padding:9px 12px;border-radius:10px;
  background:var(--surface2);border:1px dashed var(--line-strong);box-shadow:var(--shadow-sm);
  transition:left .35s cubic-bezier(.22,.61,.36,1),top .35s cubic-bezier(.22,.61,.36,1),opacity .25s;
}
.gw-t{font-size:var(--fs-body);font-weight:700}
.gw-s{font-size:var(--fs-micro);color:var(--muted)}
.lane-label{
  position:absolute;display:none;
  font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;color:var(--muted);
}

.node{
  position:absolute;width:210px;padding:10px 12px 9px 15px;border-radius:10px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm);
  transition:left .35s cubic-bezier(.22,.61,.36,1),top .35s cubic-bezier(.22,.61,.36,1),opacity .25s;
}
.node.fresh{transition:none;animation:nodeIn .4s .12s cubic-bezier(.22,.61,.36,1) backwards}
.node.fresh.queued{animation-name:nodeInDown}
@keyframes nodeIn{from{opacity:0;transform:translateX(-36px) scale(.96)}to{opacity:1;transform:none}}
@keyframes nodeInDown{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:none}}
.node::before{
  content:"";position:absolute;left:5px;top:10px;bottom:10px;width:3px;border-radius:2px;
  background:var(--st-g);
}
.node:hover{border-color:var(--muted)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
/* 선택 시 같은 작업 단위(상위+하위)만 또렷하게, 나머지는 흐리게 */
#canvas.focus .node:not(.rel){opacity:.38}
#canvas.focus .edge:not(.rel){opacity:.25}
.edge.rel{stroke:var(--accent);stroke-width:2.5}
#zfit.manual{color:var(--accent);border-color:var(--accent)}
.node.st-run{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:var(--shadow-sm)}50%{box-shadow:0 0 0 4px var(--st-bg)}}
/* 캐스케이드 합성: 등장 + 펄스, 선택 링 + 펄스 (동일 특이성이라 뒤 규칙이 앞 animation을 덮어쓰는 문제 방지) */
.node.fresh.st-run{animation:nodeIn .4s .12s cubic-bezier(.22,.61,.36,1) backwards,pulse 2.2s .52s ease-in-out infinite}
@keyframes pulseSel{0%,100%{box-shadow:0 0 0 3px var(--ring)}50%{box-shadow:0 0 0 3px var(--ring),0 0 0 6px var(--st-bg)}}
.node.sel.st-run{animation:pulseSel 2.2s ease-in-out infinite}
#canvas.paused .node.st-run,#canvas.paused .edge.run{animation:none} /* kill switch: 정지된 워커는 펄스·흐름 멈춤 */
.n-top{display:flex;align-items:center;gap:8px}
.n-title{font-size:var(--fs-body);font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-meta{font-size:var(--fs-micro);color:var(--muted);margin-top:2px}
.n-step{font-size:var(--fs-small);color:var(--text);margin-top:6px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-foot{display:flex;align-items:center;margin-top:6px;font-size:var(--fs-micro);color:var(--muted)}
.n-foot .br{margin-left:auto}
.node.sub{width:186px;padding:8px 10px 7px 13px}
.node.sub .n-title{font-size:var(--fs-small)}
.node.sub .n-step{margin-top:3px}
.node.queued{width:210px;padding:8px 10px 8px 13px}
.node.queued .n-title{font-size:var(--fs-small)}
.node.queued .n-step,.node.queued .n-foot{display:none}

.legend{
  position:absolute;left:12px;bottom:12px;display:flex;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;font-size:var(--fs-micro);color:var(--muted);box-shadow:var(--shadow-sm);
}
.legend span{display:flex;align-items:center;gap:5px}
.canvas-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.ct-btn{
  width:30px;height:30px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm);
  font-size:14px;line-height:1;color:var(--text);
}
.ct-btn:hover{background:var(--surface2)}
#emptyHint{
  position:absolute;left:264px;top:40px;width:400px;display:flex;flex-direction:column;
  gap:4px;color:var(--muted);pointer-events:none;font-size:var(--fs-small);
}
#emptyHint .big{font-size:var(--fs-title);font-weight:700;color:var(--text)}

/* detail */
.detail{
  background:var(--surface);border-left:1px solid var(--line-strong);
  display:flex;flex-direction:column;min-height:0;
}
.d-head{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid var(--line);
  font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;color:var(--muted);
}
.d-head .x{
  margin-left:auto;width:24px;height:24px;border-radius:6px;border:0;cursor:pointer;
  background:none;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;
}
.d-head .x:hover{background:var(--surface2)}
.d-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.d-empty{color:var(--muted);font-size:var(--fs-small);padding:24px 6px;text-align:center}
.d-title{font-size:var(--fs-title);font-weight:700;line-height:1.4}
.d-rows{display:grid;grid-template-columns:64px 1fr;row-gap:7px;column-gap:10px;font-size:var(--fs-small);margin:0}
.d-rows dt{color:var(--muted)}
.d-rows dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.d-sec{font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;color:var(--muted);
  padding-bottom:5px;border-bottom:1px solid var(--line)}
.d-q{background:var(--c-wait-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:var(--fs-small)}
.d-q .qt{font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  height:26px;padding:0 11px;border-radius:999px;cursor:pointer;font-size:var(--fs-small);
  background:var(--surface);border:1px solid var(--line-strong);color:var(--text);
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;pointer-events:none}
.d-actions{display:flex;gap:8px}
.act{
  height:28px;padding:0 12px;border-radius:6px;cursor:pointer;font-size:var(--fs-small);font-weight:600;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--text);
}
.act:hover{background:var(--surface2)}
.act.danger{color:var(--c-err);border-color:var(--c-err)}
.act.danger:hover{background:var(--c-err-bg)}
.tl{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-small)}
.tl-row{display:flex;gap:9px;align-items:baseline}
.tl-row time{font-size:var(--fs-micro);color:var(--muted);flex:none}
.tl-row p{margin:0;min-width:0}

/* chat dock */
.chat{
  display:flex;flex-direction:column;min-height:0;position:relative;
  background:var(--surface);border-top:1px solid var(--line-strong);
}
.chat-h{
  display:flex;align-items:baseline;gap:10px;padding:7px 16px;
  border-bottom:1px solid var(--line);
  font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;color:var(--muted);
}
.chat-h .sub{font-weight:400;letter-spacing:0}
.chat-body{display:flex;flex:1;min-height:0}
.chat-main{flex:1;min-width:0;display:flex;flex-direction:column}
#dlog{width:296px;flex:none; /* = 태스크 상세 기본 폭(--dw 296px)과 동일 */border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dl-h{
  padding:7px 12px;border-bottom:1px solid var(--line);
  font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;color:var(--muted);
}
.dl-list{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:9px}
.dl-row{display:flex;flex-direction:column;gap:3px}
.dl-msg{font-size:var(--fs-small);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-st{display:flex;align-items:center;gap:6px;font-size:var(--fs-micro);color:var(--muted);flex-wrap:wrap}
.dl-st .judging{color:var(--c-wait);font-weight:600;display:flex;align-items:center;gap:5px}
.dl-st .judging::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--c-wait-g);
  animation:dlPulse 1s ease-in-out infinite;
}
@keyframes dlPulse{50%{opacity:.25}}
.dl-empty{color:var(--muted);font-size:var(--fs-micro);padding:4px 0}
@media (max-width:1100px){#dlog{display:none}}
#msgs{ /* 스크롤 컨테이너는 패널 전체 폭, 내용 열만 920px 중앙 정렬 → 스크롤바가 가장자리에 붙음 */
  flex:1;overflow-y:auto;padding:10px 20px;display:grid;grid-template-columns:minmax(0,920px);justify-content:center;align-content:start;gap:8px;
}
.m-user{justify-self:end;max-width:64%;background:var(--accent-soft);border:1px solid var(--line);
  border-radius:12px 12px 3px 12px;padding:7px 12px;font-size:var(--fs-body)}
.m-row{justify-self:start;max-width:78%;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.m-sys{background:var(--surface2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;
  padding:7px 12px;font-size:var(--fs-body)}
.m-note{justify-self:center;font-size:var(--fs-micro);color:var(--muted)}
.m-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{
  font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--muted);
  background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;
}
.badge.k{color:var(--accent);border-color:var(--line-strong);font-weight:600}
.ttag{
  display:inline-flex;font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:600;
  color:var(--st);background:var(--st-bg);border-radius:5px;padding:1px 7px;
  cursor:pointer;border:0;
}
.m-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chat-in{display:flex;gap:8px;padding:10px 20px 12px;border-top:1px solid var(--line);justify-content:center}
#input{
  flex:0 1 820px;height:38px;padding:0 14px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line-strong);
}
#input::placeholder{color:var(--muted)}
#input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
#sendBtn{
  flex:none;white-space:nowrap;height:38px;padding:0 18px;border-radius:9px;border:0;cursor:pointer;font-weight:700;
  background:var(--accent);color:var(--accent-ink);font-size:var(--fs-body);
}
#sendBtn:hover{filter:brightness(1.07)}

/* ---------- notifications ---------- */
.conn{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:var(--fs-micro);color:var(--muted)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--c-done)}
#notifBtn .nb{
  position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;display:none;
  background:var(--accent);color:var(--accent-ink);
  font-size:10px;font-weight:700;align-items:center;justify-content:center;
}
#notifBtn.has .nb{display:inline-flex}
#notifBtn.dnd{color:var(--muted)}
#notifBtn.dnd::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:2px;margin:-1px 0 0 -9px;background:currentColor;transform:rotate(-40deg);border-radius:1px} /* 방해 금지 = 벨에 사선 */
#toasts{position:fixed;right:12px;top:56px;width:320px;display:flex;flex-direction:column;gap:8px;z-index:60}
.ncard{
  position:relative;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:10px;box-shadow:var(--shadow-lg);padding:8px 30px 8px 17px;cursor:pointer;
}
.ncard::before{content:"";position:absolute;left:6px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--st)}
.ncard:hover{border-color:var(--muted)}
.ncard .nt{display:flex;align-items:baseline;gap:8px}
.ncard .nt b{font-size:var(--fs-body);font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .nt time{font-size:var(--fs-micro);color:var(--muted);flex:none}
.ncard .nb2{font-size:var(--fs-small);color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard .nx{
  position:absolute;right:5px;top:5px;width:20px;height:20px;border:0;border-radius:5px;cursor:pointer;
  background:none;color:var(--muted);font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.ncard .nx:hover{background:var(--surface2);color:var(--text)}
.toast{transition:transform .25s ease,opacity .25s ease}
.toast.in{transform:translateX(20px);opacity:0}
.toast.out{transform:translate(26px,-12px) scale(.96);opacity:0}
#notifCenter{
  position:fixed;right:12px;top:56px;width:320px;max-height:72vh;display:none;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:var(--shadow-lg);z-index:70;overflow:hidden;
}
#notifCenter.open{display:flex;animation:drop .16s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.nc-h{
  padding:10px 14px;border-bottom:1px solid var(--line);
  font-size:var(--fs-micro);font-weight:700;letter-spacing:.07em;color:var(--muted);
}
.nc-body{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.nc-empty{color:var(--muted);font-size:var(--fs-small);text-align:center;padding:18px 0}
.nc-group{display:flex;flex-direction:column;gap:8px}
.nc-gh{display:flex;align-items:center;gap:6px;font-size:var(--fs-micro);font-weight:700;letter-spacing:.05em;color:var(--muted)}
.nc-gh .grow{flex:1}
.nc-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:var(--fs-micro);padding:2px 6px;border-radius:4px}
.nc-btn:hover{background:var(--surface2);color:var(--text)}
.stack{position:relative;isolation:isolate;padding-bottom:10px} /* macOS식 스택: 뒤에 카드 2장이 살짝 보임 */
.stack::before,.stack::after{
  content:"";position:absolute;left:7px;right:7px;top:12px;bottom:5px;z-index:-1;
  border-radius:10px;background:var(--surface);border:1px solid var(--line);
}
.stack::after{left:14px;right:14px;bottom:0;z-index:-2}
input[type="checkbox"]{accent-color:var(--accent)}
.nc-f{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:var(--fs-small)}
.nc-f label{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.gw.judging{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.gw.judging .gw-s{color:var(--accent)}

/* ---------- settings ---------- */
#settings{
  position:fixed;right:12px;top:56px;width:300px;display:none;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:var(--shadow-lg);z-index:70;overflow:hidden;
}
#settings.open{display:flex;animation:drop .16s ease}
.set-body{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;height:46px;padding:0 14px;font-size:var(--fs-small)}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-warn{font-style:normal;font-weight:600;font-size:var(--fs-micro);color:var(--c-wait);margin-left:6px}
.seg{display:flex;align-items:stretch;height:28px;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font-size:var(--fs-micro);padding:0 9px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.step{display:flex;align-items:center;gap:8px}
.step button{
  width:24px;height:24px;border-radius:6px;border:1px solid var(--line-strong);cursor:pointer;
  background:var(--surface);color:var(--text);font-size:13px;line-height:1;
}
.step button:hover{background:var(--surface2)}
.step b{font-size:var(--fs-body);min-width:14px;text-align:center}
.set-info{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-micro)}
.set-projs{display:flex;flex-direction:column;max-height:132px;overflow:auto;border-top:1px solid var(--line)}
.set-proj{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:var(--fs-small)}
.set-proj+.set-proj{border-top:1px solid var(--line)}
.set-proj .txt{min-width:0;flex:1}
.set-proj .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-proj .mm{color:var(--muted);font-size:var(--fs-micro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-projf{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px solid var(--line)}
.set-projf input{
  flex:1 1 46%;min-width:0;height:26px;padding:0 8px;border-radius:6px;
  background:var(--surface2);border:1px solid var(--line-strong);color:var(--text);font-size:var(--fs-micro);font-family:inherit;
}
.set-projf button{flex:none}

/* ---------- minimap ---------- */
#minimap{
  position:absolute;right:12px;bottom:12px;width:172px;height:116px;overflow:hidden;cursor:pointer;touch-action:none;
  background:color-mix(in srgb, var(--surface) 74%, transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);
  opacity:.85;transition:opacity .15s;
}
#minimap:hover{opacity:1}
.mm-node{position:absolute;border-radius:2.5px;background:var(--st-g);opacity:.9}
.mm-gw{position:absolute;border-radius:2.5px;border:1px dashed var(--muted);opacity:.65}
.mm-view{
  position:absolute;border:1.5px solid var(--accent);border-radius:3px;pointer-events:none;
  box-shadow:0 0 0 240px color-mix(in srgb, var(--ground) 42%, transparent);
}

/* ---------- 패널 접기 (단축키/팔레트) ---------- */
#app.hide-sb{--sbw:0px}
#app.hide-sb .sidebar,#app.hide-sb .rz-sb{display:none}
#app.hide-dt{--dw:0px}
#app.hide-dt .detail,#app.hide-dt .rz-dt{display:none}
#app.hide-ch{--chh:0px}
#app.hide-ch .chat{display:none}

/* ---------- 명령 팔레트 · 단축키 편집 ---------- */
#palette,#keysEd{
  position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;
  background:color-mix(in srgb, var(--ground) 52%, transparent);
}
#palette.open,#keysEd.open{display:flex}
.pal-box{
  margin-top:11vh;width:500px;max-width:92vw;overflow:hidden;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:var(--shadow-lg);animation:drop .16s ease;
}
#palInput{
  width:100%;height:42px;padding:0 14px;border:0;border-bottom:1px solid var(--line);
  background:var(--surface);font-size:var(--fs-body);
}
#palInput:focus{outline:none}
.pal-list{max-height:340px;overflow-y:auto;padding:6px}
.pal-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 10px;border-radius:7px;cursor:pointer;font-size:var(--fs-body);
}
.pal-item.act{background:var(--accent-soft)}
.pal-item kbd{
  font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--muted);
  background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;
}
.pal-empty{padding:14px;text-align:center;color:var(--muted);font-size:var(--fs-small)}
.ked-box{
  margin-top:14vh;width:460px;max-width:92vw;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:var(--shadow-lg);animation:drop .16s ease;
}
#kedText{
  margin:12px 14px 6px;padding:10px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--surface2);color:var(--text);font-family:var(--font-mono);font-size:var(--fs-small);resize:vertical;
}
#kedText:focus{outline:none;border-color:var(--accent)}
.ked-err{padding:0 14px;color:var(--c-err);font-size:var(--fs-micro);min-height:16px}
.ked-f{display:flex;gap:8px;padding:8px 14px 12px}
.ked-f #kedClose{margin-left:auto}

/* ---------- pool block · banner · timeline payload ---------- */
.pool{margin:6px 12px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:var(--fs-micro);color:var(--muted);display:flex;flex-direction:column;gap:3px}
.pool b{color:var(--text);font-weight:700}
.pool.warn{border-color:var(--c-wait-g);color:var(--c-wait)}
#banner{grid-row:2;grid-column:1/-1;display:none;align-items:center;gap:10px;padding:6px 16px;
  font-size:var(--fs-small);font-weight:600;border-bottom:1px solid var(--line-strong);background:var(--c-wait-bg);color:var(--c-wait)}
#banner.on{display:flex}
#banner.err{background:var(--c-err-bg);color:var(--c-err)}
#banner .act{margin-left:auto;height:24px;padding:0 10px}
.conn.off i{background:var(--c-err-g)}
.conn.sync i{background:var(--c-wait-g)}
.tl-row details{min-width:0}
.tl-row summary{cursor:pointer;list-style:none}
.tl-row summary::after{content:" ▸";color:var(--muted)}
.tl-row details[open] summary::after{content:" ▾"}
.tl-row pre{margin:4px 0 0;padding:6px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);
  font-family:var(--font-mono);font-size:var(--fs-micro);white-space:pre-wrap;color:var(--muted)}
.d-btns{display:flex;gap:6px;flex-wrap:wrap}
.dl-st .fail{color:var(--c-err);font-weight:600}
.dl-st .fast{color:var(--c-done);font-weight:600}

/* ---------- reduce motion (설정) ---------- */
.reduce .node.st-run{animation:none}
.reduce .edge.run{animation:none}
.reduce .toast{transition:none}
.reduce #notifCenter.open,.reduce #settings.open{animation:none}
.reduce .node,.reduce .gw{transition:none}
.reduce .node.fresh{animation:none}
.reduce .pal-box,.reduce .ked-box{animation:none}
.reduce .dl-st .judging::before{animation:none}

/* narrow screens: detail becomes an overlay */
@media (max-width:980px){
  #app{grid-template-columns:200px 1fr 0}
  .rz-sb,.rz-dt{display:none}
  .detail{display:none}
  .detail.open{
    display:flex;position:absolute;right:0;top:calc(48px + var(--bh,0px));bottom:var(--chh,232px);width:296px;z-index:20;
    box-shadow:var(--shadow-lg);
  }
}
@media (prefers-reduced-motion:reduce){
  .node.st-run,.node.sel.st-run,.node.fresh.st-run{animation:none}
  .edge.run{animation:none}
  .toast{transition:none}
  .node,.gw{transition:none}
  .node.fresh{animation:none}
}
</style>
</head>
<body>

      </button>
    </div>
  </header>
<div id="banner" role="status"></div>

  <div class="rz rz-sb" aria-hidden="true"></div>
  <div class="rz rz-dt" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar" aria-label="태스크 목록"></aside>

    <section class="canvas" id="canvas" aria-label="태스크 그래프">

</div>
<div id="settings" role="dialog" aria-label="설정">
  <div class="nc-h">설정</div>
  <div class="set-body">
    <div class="set-row"><span>테마</span>
      <div class="seg" id="segTheme">
        <button data-m="system">자동</button><button data-m="light">라이트</button><button data-m="dark">다크</button>
      </div>

    <div class="set-row"><span>그래프 레이아웃</span>
      <div class="seg" id="segLayout">
        <button data-l="tree">계단</button><button data-l="radial">방사</button>
      </div>

    <div class="set-row"><span>패널 정렬</span>
      <div class="seg" id="segAlign">
        <button data-a="justify">전체</button><button data-a="center">중앙</button><button data-a="left">왼쪽</button><button data-a="right">오른쪽</button>
      </div>

  </div>
  <div class="set-projs" id="projList"></div>
  <div class="set-projf">
    <input id="projName" placeholder="이름" aria-label="프로젝트 이름">
    <input id="projPath" placeholder="경로" aria-label="프로젝트 경로">
    <input id="projDesc" placeholder="설명" aria-label="프로젝트 설명">

  <div class="pal-box">
    <input id="palInput" aria-label="명령 검색" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" placeholder="명령 검색… (↑↓ 이동 · Enter 실행 · Esc 닫기)" autocomplete="off">

      <button class="act" id="kedSave">저장</button>
      <button class="act" id="kedReset">기본값</button>
      <button class="act" id="kedClose">닫기</button>
    </div>

</div>

<script>"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
const pad=n=>String(n).padStart(2,"0");
const clock=d=>pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
function dur(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+":"+pad(s%60)}

/* ================= theme ================= */
const Theme={
  KEY:"relay-theme",mode:"system",
  init(){
    const m=localStorage.getItem(this.KEY);
    this.mode=["system","light","dark"].includes(m)?m:"system";
    this.apply(true);
  },
  set(m){this.mode=m;localStorage.setItem(this.KEY,m);this.apply(false);renderSettings()},
  apply(initial){
    const r=document.documentElement;
    if(this.mode==="system"){if(!initial)r.removeAttribute("data-theme")}
    else r.setAttribute("data-theme",this.mode);
  },
};
Theme.init();

/* ================= state ================= */
const ROW_H=128, SUB_ROW=102, COL_TASK=312, COL_SUB=596, ROW_Y0=40;
const S={tasks:new Map(),sel:null,maxw:10, /* 기본 10, 상한 없음(초과 시 소프트 경고) */autofit:true,reduce:false,layout:"tree",paused:false,usage:0,conn:"ok"};
const STATUS_LABEL={run:"실행 중",wait:"응답 대기",queue:"대기열",done:"완료",err:"오류",cancelled:"중단됨",closed:"보관됨"};

const tasksArr=()=>[...S.tasks.values()];

/* ================= chat ================= */
const msgs=$("#msgs");
function scrollChat(){msgs.scrollTop=msgs.scrollHeight}
function chatUser(text){msgs.append(el("div","m-user",text));scrollChat()}
function chatNote(text){msgs.append(el("div","m-note",text));scrollChat()}
function ttagBtn(t){
  const b=el("button","ttag st-"+t.status,t.id);
  b.addEventListener("click",()=>{select(t.id);centerOn(t)});
  return b;
}
function chatMsg(t,text){
  const wrap=el("div","m-row");
  if(t)wrap.append(ttagBtn(t));
  wrap.append(el("div","m-sys",text));
  msgs.append(wrap);scrollChat();
}
function chatQuestion(t){
  const wrap=el("div","m-row");
  wrap.append(ttagBtn(t));
  wrap.append(el("div","m-sys",t.question.q));
  const chips=el("div","m-chips");chips.dataset.task=t.id;
  t.question.chips.forEach(c=>{
    const b=el("button","chip",c);
    b.addEventListener("click",()=>answerQuestion(t,c));
    chips.append(b);
  });
  wrap.append(chips);
  msgs.append(wrap);scrollChat();
}

/* ================= dispatch log (채팅 우측 레일) ================= */
const DLOG=[];
function renderDlog(){
  const list=$("#dlList");if(!list)return;
  list.textContent="";
  if(!DLOG.length){
    list.append(el("div","dl-empty","메시지를 보내면 접수 → 판단 → 배치 과정이 여기에 기록됩니다"));
    return;
  }
  DLOG.forEach(en=>{
    const row=el("div","dl-row");
    row.append(el("div","dl-msg",en.text));
    const st=el("div","dl-st");
    if(en.status==="judging"){
      st.append(el("span","judging","판단 중"));
    }else{
      const r=en.result||{};
      if(r.action)st.append(el("span","mono"+(r.action==="failed"?" fail":r.action==="fast-path"?" fast":""),r.action));
      if(r.ids&&r.ids.length){
        st.append(el("span",null,"→"));
        r.ids.forEach(id=>{const t=S.tasks.get(id);if(t)st.append(ttagBtn(t))});
        if(r.action==="route_to_task")st.append(el("span",null,"· accepted"));
      }else if(r.note){
        st.append(el("span",null,r.note));
      }
      if(r.action==="failed"){
        const b=el("button","nc-btn","재시도");
        b.addEventListener("click",()=>relay.redispatch(en.messageId));
        st.append(b);
      }
    }
    row.append(st);
    list.append(row);
  });
}

/* ================= server actions (window.relay, installed by web/src/adapter.ts) ================= */
function send(text){text=text.trim();if(!text)return;relay.send(text)}                     /* the server echoes the message as chat.message — no optimistic row */
function answerQuestion(t,choice){if(t.status!=="wait")return;relay.answer(t,choice)}
function stopTask(t){relay.stop(t)}
function restartTask(t){relay.restart(t)}
function archiveTask(t){relay.archive(t)}
function togglePause(){relay.pause()}                                                   /* banner/settings re-render when system.state arrives */
function runningCount(){return S.running??tasksArr().filter(t=>t.status==="run").length}  /* server count is authoritative */

/* ================= lifecycle ================= */
/* 대기열 순서: 답변 후 permit 재획득 대기(qhead)가 선두, 나머지는 큐 진입 시각 FIFO */
const queueOrder=(a,b)=>(b.qhead?1:0)-(a.qhead?1:0)||(a.queuedAt||0)-(b.queuedAt||0);
const queuedTasks=()=>tasksArr().filter(t=>t.status==="queue").sort(queueOrder);
/* ================= layout & graph ================= */
const world=$("#world"),nodesBox=$("#nodes"),edgesSvg=$("#edges"),gwEl=$("#gw"),canvas=$("#canvas");
function layout(){
  const notSub=tasksArr().filter(t=>!t.sub&&t.status!=="closed");
  const active=notSub.filter(t=>t.status!=="queue");
  const queued=notSub.filter(t=>t.status==="queue").sort(queueOrder);
  const kidsOf=t=>t.children.map(id=>S.tasks.get(id)).filter(c=>c&&c.status!=="closed");
  if(S.layout==="tree"){
    /* 계단: 게이트웨이 좌상단 고정, 태스크는 아래로 적층, 서브는 부모 행에서 시작해 적층 */
    gwEl.style.left="32px";gwEl.style.top=ROW_Y0+"px";
    let cursor=ROW_Y0;
    active.forEach(t=>{
      t.x=COL_TASK;t.y=cursor;
      const kids=kidsOf(t);
      if(kids.length){
        let sy=cursor;
        kids.forEach(c=>{c.x=COL_SUB;c.y=sy;sy+=SUB_ROW});
        cursor=Math.max(cursor+ROW_H,sy+26);
      }else{
        cursor+=ROW_H;
      }
    });
  }else{
    /* 방사: 게이트웨이가 세로 중앙에서 곡선으로 퍼져나가는 형태 */
    active.forEach((t,i)=>{t.x=COL_TASK;t.y=ROW_Y0+i*ROW_H});
    active.forEach(t=>{
      kidsOf(t).forEach((c,i)=>{c.x=COL_SUB;c.y=t.y+(i===0?-58:66)});
    });
    const ys=active.map(t=>t.y);
    const gy=ys.length?ys.reduce((a,b)=>a+b,0)/ys.length+22:ROW_Y0;
    gwEl.style.left="40px";gwEl.style.top=gy+"px";
  }
  /* 대기열 레인: 게이트웨이 아래 FIFO 스택 */
  const laneX=parseFloat(gwEl.style.left)||32;
  const laneY0=(parseFloat(gwEl.style.top)||ROW_Y0)+gwEl.offsetHeight+40;
  queued.forEach((t,i)=>{t.x=laneX;t.y=laneY0+i*76});
  const eh=document.getElementById("emptyHint");
  eh.style.top=((parseFloat(gwEl.style.top)||ROW_Y0)+6)+"px";eh.style.left=(parseFloat(gwEl.style.left)+gwEl.offsetWidth+36)+"px";
  const ll=document.getElementById("laneLabel");
  ll.style.display=queued.length?"block":"none";
  ll.style.left=(laneX+34)+"px";ll.style.top=(laneY0-19)+"px";
}
function nodeEl(t){
  let n=document.getElementById("node-"+t.id);
  if(!n){
    n=el("div","node");n.id="node-"+t.id;n.setAttribute("role","button");n.tabIndex=0;
    const top=el("div","n-top");
    top.append(el("span","n-title"),el("span","pill"));
    n.append(top,el("div","n-meta mono"),el("div","n-step"));
    const foot=el("div","n-foot");
    foot.append(el("span","n-elapsed mono"),el("span","br mono"));
    n.append(foot);
    n.addEventListener("click",e=>{e.stopPropagation();select(t.id)});
    n.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();select(t.id)}
    });
    nodesBox.append(n);
    n.dataset.fresh="1"; /* 첫 프레임: 이동 트랜지션 없이 페이드-인 */
    requestAnimationFrame(()=>requestAnimationFrame(()=>{delete n.dataset.fresh;n.classList.remove("fresh")}));
  }
  return n;
}
function elapsedText(t){
  if(t.status==="queue")return"대기 중";
  if(!t.startedAt)return"";
  return dur((t.endedAt||new Date())-t.startedAt);
}
function renderNodes(){
  const fam=famOf(S.sel);canvas.classList.toggle("focus",fam.size>0);canvas.classList.toggle("paused",S.paused);
  tasksArr().forEach(t=>{
    if(t.status==="closed"){
      const dead=document.getElementById("node-"+t.id);
      if(dead)dead.remove();
      return;
    }
    const n=nodeEl(t);
    n.className="node st-"+t.status+(t.sub?" sub":"")+(!t.sub&&t.status==="queue"?" queued":"")+(S.sel===t.id?" sel":"")+(fam.has(t.id)?" rel":"")+(n.dataset.fresh?" fresh":"");
    n.style.left=t.x+"px";n.style.top=t.y+"px";
    n.querySelector(".n-title").textContent=t.title;
    let pillTxt=t.status==="run"&&S.paused?"정지됨":(t.statusLabel||STATUS_LABEL[t.status]);
    if(!t.sub&&t.status==="queue"){
      const qi=queuedTasks().filter(x=>!x.sub).indexOf(t);
      pillTxt="대기 "+(qi+1);
    }
    n.querySelector(".pill").textContent=pillTxt;
    n.querySelector(".n-meta").textContent=t.sub
      ?t.id+" · sub"
      :t.id+" · "+t.project+" · "+t.size;
    n.querySelector(".n-step").textContent=t.step;
    n.querySelector(".n-elapsed").textContent=elapsedText(t);
    n.querySelector(".br").textContent=t.sub?"":t.branch||"";
    n.setAttribute("aria-label",t.title+" — "+(t.statusLabel||STATUS_LABEL[t.status]));
  });
  $("#emptyHint").style.display=tasksArr().some(t=>t.status!=="closed")?"none":"flex";
}
function edgeCls(t){
  if(t.msgUntil&&t.msgUntil>Date.now())return"edge msg";
  if(t.status==="run"||t.status==="wait")return"edge run";
  if(t.status==="queue")return"edge queue";
  return"edge";
}
function drawIn(path,t){ /* 새 노드의 엣지를 부모→자식 방향으로 그려 넣기 */
  if(S.reduce)return;
  const p=Math.min(1,(Date.now()-t.bornAt)/450);
  if(p>=1)return;
  const len=path.getTotalLength();
  path.style.strokeDasharray=len+"";path.style.strokeDashoffset=(len*(1-p))+"";
  path.style.animation="none";
}
function renderEdges(){
  edgesSvg.textContent="";const fam=famOf(S.sel);
  const tree=S.layout==="tree", A=22; /* tree: 노드 상단(제목 행) 기준 앵커 — 첫 행은 수평선 */
  tasksArr().forEach(t=>{
    if(t.status==="closed")return;
    if(!t.sub&&t.status==="queue")return; /* 대기열은 아래 체인으로 */
    const n=document.getElementById("node-"+t.id);if(!n)return;
    let x1,y1;
    if(t.sub){
      const p=S.tasks.get(t.parent),pn=p&&document.getElementById("node-"+p.id);
      if(!pn||p.status==="closed")return;
      x1=pn.offsetLeft+pn.offsetWidth;
      y1=tree?pn.offsetTop+A:pn.offsetTop+pn.offsetHeight/2;
    }else{
      x1=gwEl.offsetLeft+gwEl.offsetWidth;
      y1=tree?gwEl.offsetTop+A:gwEl.offsetTop+gwEl.offsetHeight/2;
    }
    const x2=n.offsetLeft;
    const y2=tree?n.offsetTop+A:n.offsetTop+n.offsetHeight/2;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    const cx=Math.round((x1+x2)/2); /* 두 레이아웃 모두 S-베지어 곡선 — 첫 행은 y1==y2라 자연히 수평선 */
    path.setAttribute("d","M"+x1+" "+y1+" C"+cx+" "+y1+" "+cx+" "+y2+" "+x2+" "+y2);
    path.setAttribute("class",edgeCls(t)+(fam.has(t.id)?" rel":""));
    edgesSvg.append(path);drawIn(path,t);
  });
  /* 대기열 체인: 게이트웨이 아래로 FIFO 세로 연결 */
  const qs=queuedTasks().filter(t=>!t.sub);
  qs.forEach((t,i)=>{
    const n=document.getElementById("node-"+t.id);if(!n)return;
    const x=n.offsetLeft+22;
    let y1=gwEl.offsetTop+gwEl.offsetHeight;
    if(i>0){
      const p=document.getElementById("node-"+qs[i-1].id);
      if(p)y1=p.offsetTop+p.offsetHeight;
    }
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d","M"+x+" "+y1+" V"+n.offsetTop);
    path.setAttribute("class","edge queue");
    edgesSvg.append(path);drawIn(path,t);
  });
}
let edgeAnimUntil=0;
function animateEdges(){ /* 노드 위치 전환(300ms) 동안 엣지가 따라붙도록 */
  edgeAnimUntil=performance.now()+650;
  requestAnimationFrame(function loop(){
    renderEdges();
    if(performance.now()<edgeAnimUntil)requestAnimationFrame(loop);
  });
}

/* ================= sidebar ================= */
const GROUPS=[
  {label:"조치 필요",match:t=>t.status==="wait"||t.status==="err"||t.status==="cancelled",cls:"attn"},
  {label:"실행 중",match:t=>t.status==="run"},
  {label:"대기열",match:t=>t.status==="queue"},
  {label:"완료 · 보관",match:t=>t.status==="done"||t.status==="closed"},
];
const sideMeta=t=>t.id+" · "+t.project+" · "+(elapsedText(t)||"—");
function renderSidebar(){
  const fam=famOf(S.sel);
  const sb=$("#sidebar"),st=sb.scrollTop;sb.textContent="";
  const pool=el("div","pool"+(S.usage>(S.dailyCeiling||1e6)*.8?" warn":""));
  const r1=el("div");r1.append(el("b",null,"에이전트 "+runningCount()+"/"+S.maxw),el("span",null," · 대기 "+tasksArr().filter(t=>t.status==="queue").length+(S.paused?" · ⏸ 일시정지":"")));
  const r2=el("div");r2.append(el("span",null,"오늘 사용량 ≈ "),el("b",null,Math.round(S.usage/1000)+"k 토큰"),el("span",null," (추정)"+(S.usage>(S.dailyCeiling||1e6)*.8?" · 소프트 한도 초과":"")));
  pool.append(r1,r2);sb.append(pool);
  GROUPS.forEach(g=>{
    const list=tasksArr().filter(t=>!t.sub&&g.match(t));
    const box=el("div","group");
    const h=el("div","group-h"+(g.cls&&list.length?" "+g.cls:""));
    h.append(el("span",null,g.label),el("span","cnt",String(list.length)));
    box.append(h);
    if(!list.length)box.append(el("div","group-empty","없음"));
    list.forEach(t=>{
      const it=el("button","s-item st-"+t.status+(S.sel===t.id?" sel":fam.has(t.id)?" rel":"")+(t.status==="closed"?" closed":""));
      it.append(el("i","dot"));
      const txt=el("div","txt");
      txt.append(el("div","tt",t.title));
      const mm=el("div","mm mono",sideMeta(t));mm.dataset.el=t.id;mm.dataset.fmt="side";txt.append(mm);
      it.append(txt);
      it.addEventListener("click",()=>{select(t.id);centerOn(t)});
      box.append(it);
    });
    sb.append(box);
  });
  sb.scrollTop=st;
}

/* ================= detail ================= */
function renderDetail(){
  const body=$("#dBody"),t=S.sel?S.tasks.get(S.sel):null;
  $("#detail").classList.toggle("open",!!t);
  const st=body.scrollTop,openSet=new Set([...body.querySelectorAll("details[open]")].map(d=>d.dataset.i)); /* 재구성 후 복원 */
  body.textContent="";
  if(!t){body.append(el("div","d-empty","그래프나 사이드바에서 태스크를 선택하면 상세가 표시됩니다."));return}

  body.append(el("div","d-title",t.title));

  const rows=el("dl","d-rows");
  const row=(k,v,mono)=>{
    rows.append(el("dt",null,k));
    const dd=el("dd",mono?"mono":null);
    if(v instanceof Node)dd.append(v);else dd.textContent=v;
    rows.append(dd);return dd;
  };
  const pillWrap=el("span","st-"+t.status);
  pillWrap.append(el("span","pill",(t.statusLabel||STATUS_LABEL[t.status])));
  row("상태",pillWrap);
  row("ID",t.id,true);
  row("프로젝트",t.project,true);
  row("크기",t.sub?"sub · "+t.agentType:t.size+" ("+t.model+"·"+t.effort+")");
  if(!t.sub)row("브랜치",t.branch,true);
  row("세션",t.sid+" · "+t.proc+" · gen "+t.gen+(t.attached?" · attach("+t.attached+")":""),true);
  row("시작",t.startedAt?clock(t.startedAt):"—",true);
  row("경과",elapsedText(t)||"—",true).dataset.el=t.id;
  const kin=(t.sub?[t.parent]:t.children).filter(id=>{const r=S.tasks.get(id);return r&&r.status!=="closed"});
  if(kin.length){ /* 같은 작업 단위 — 클릭하면 그쪽으로 이동 */
    const chips=el("div","chips");
    kin.forEach(id=>{const r=S.tasks.get(id);const b=el("button","chip",id+" · "+r.title);b.addEventListener("click",()=>{select(id);centerOn(r)});chips.append(b)});
    row(t.sub?"상위":"하위",chips);
  }
  body.append(rows);

  if(t.status==="wait"&&t.question){
    const q=el("div","d-q st-wait");
    q.append(el("div","qt",t.question.q));
    const chips=el("div","chips");
    t.question.chips.forEach(c=>{
      const b=el("button","chip",c);
      b.addEventListener("click",()=>answerQuestion(t,c));
      chips.append(b);
    });
    q.append(chips);body.append(q);
  }

  if(!t.sub){
    const btns=el("div","d-btns");
    const b1=el("button","act","터미널에서 열기");
    b1.addEventListener("click",()=>relay.attach(t));
    const b2=el("button","act","worktree 경로 복사");
    b2.addEventListener("click",()=>{const pth=t.worktree||"(worktree 없음)";navigator.clipboard&&navigator.clipboard.writeText(pth).catch(()=>{});chatNote("클립보드에 복사: "+pth)});
    btns.append(b1,b2);body.append(btns);
    const acts=el("div","d-actions");
    if(t.status==="run"||t.status==="wait"){
      const b=el("button","act danger","중단");
      b.addEventListener("click",()=>stopTask(t));acts.append(b);
    }
    if(t.status==="err"||t.status==="cancelled"||t.statusLabel==="검토 필요"){
      const b=el("button","act","재시작");
      b.addEventListener("click",()=>restartTask(t));acts.append(b);
    }
    if(["done","err","cancelled"].includes(t.status)||t.statusLabel==="검토 필요"){
      const b=el("button","act","보관");let armed=false; /* 2단계 확인 — worktree 정리는 되돌릴 수 없다 */
      b.addEventListener("click",()=>{
        if(!armed){armed=true;b.textContent="보관 확인 (worktree 정리)";b.classList.add("danger");return}
        archiveTask(t);
      });
      acts.append(b);
    }
    if(acts.children.length)body.append(acts);
  }

  body.append(el("div","d-sec","타임라인"));
  const tl=el("div","tl");
  t.events.slice(-30).forEach(e2=>{
    const r=el("div","tl-row");
    r.append(el("time","mono",clock(e2.at)));
    if(e2.payload){
      const d=el("details");d.dataset.i=String(e2.id);if(openSet.has(d.dataset.i))d.open=true;d.append(el("summary",null,e2.txt),el("pre",null,e2.payload));r.append(d);

/* ================= pan / zoom ================= */
const MINZ=.2,MAXZ=2;
const view={x:24,y:20,k:1,manual:false}; /* manual: 사용자가 뷰를 만진 뒤엔 자동 맞춤 보류, ⤢(맞춤)으로 재개 */
function touchView(){view.manual=true;$("#zfit").classList.add("manual")}
function applyView(smooth){
  world.style.transition=(smooth&&!S.reduce)?"transform .35s cubic-bezier(.22,.61,.36,1)":"none";
  world.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.k+")";
  updateMinimap();
}
function graphBoxes(){
  const boxes=tasksArr().filter(t=>t.status!=="closed").map(t=>{
    const n=document.getElementById("node-"+t.id);
    return n?{x:t.x,y:t.y,w:n.offsetWidth,h:n.offsetHeight,st:t.status}:null;
  }).filter(Boolean);
  boxes.push({x:gwEl.offsetLeft,y:gwEl.offsetTop,w:gwEl.offsetWidth,h:gwEl.offsetHeight,st:"gw"});
  return boxes;
}
function fit(){
  view.manual=false;$("#zfit").classList.remove("manual");
  const boxes=graphBoxes();
  const minX=Math.min(...boxes.map(b=>b.x)),minY=Math.min(...boxes.map(b=>b.y));
  const maxX=Math.max(...boxes.map(b=>b.x+b.w)),maxY=Math.max(...boxes.map(b=>b.y+b.h));
  const cw=canvas.clientWidth,ch=canvas.clientHeight;
  view.k=Math.max(MINZ,Math.min(1,(cw-64)/(maxX-minX),(ch-64)/(maxY-minY)));
  if(S.layout==="tree"){ /* 좌상단 앵커 */
    view.x=28-minX*view.k;
    view.y=24-minY*view.k;
  }else{ /* 방사: 중앙 정렬 */
    view.x=(cw-(maxX-minX)*view.k)/2-minX*view.k;
    view.y=(ch-(maxY-minY)*view.k)/2-minY*view.k;
  }
  applyView(true);
}
function maybeFit(){if(S.autofit&&!view.manual)fit()}
function relayout(){layout();refresh();maybeFit();animateEdges()}
function centerOn(t){
  const n=document.getElementById("node-"+t.id);if(!n)return;
  const cw=canvas.clientWidth,ch=canvas.clientHeight;
  view.x=cw/2-(t.x+n.offsetWidth/2)*view.k;
  view.y=ch/2-(t.y+n.offsetHeight/2)*view.k;
  touchView();applyView(true);
}
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
  const k2=Math.min(MAXZ,Math.max(MINZ,view.k*(1-e.deltaY*.0012)));
  view.x=cx-(cx-view.x)*(k2/view.k);
  view.y=cy-(cy-view.y)*(k2/view.k);
  view.k=k2;touchView();applyView();
},{passive:false});
let pan=null;
canvas.addEventListener("pointerdown",e=>{
  if(e.target.closest(".node")||e.target.closest(".gw")||e.target.closest("button")||e.target.closest("#minimap"))return;
  pan={sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false};
  canvas.classList.add("panning");canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(!pan)return;
  const dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;
  if(Math.abs(dx)+Math.abs(dy)>3){pan.moved=true;touchView()}
  view.x=pan.ox+dx;view.y=pan.oy+dy;applyView();
});
canvas.addEventListener("pointerup",()=>{
  if(pan&&!pan.moved){S.sel=null;refresh()}
  pan=null;canvas.classList.remove("panning");
});
function zoomBy(f){ /* 캔버스 중심 고정 줌 */
  const cx=canvas.clientWidth/2,cy=canvas.clientHeight/2,k2=Math.min(MAXZ,Math.max(MINZ,view.k*f));
  view.x=cx-(cx-view.x)*(k2/view.k);view.y=cy-(cy-view.y)*(k2/view.k);view.k=k2;touchView();applyView(true);
}
$("#zin").addEventListener("click",()=>zoomBy(1.25));
$("#zout").addEventListener("click",()=>zoomBy(1/1.25));

/* ================= minimap ================= */
const mmEl=$("#minimap");
let mmMap=null;
function updateMinimap(){
  const hasTasks=tasksArr().some(t=>t.status!=="closed");
  mmEl.style.display=hasTasks?"":"none";
  if(!hasTasks)return;
  const boxes=graphBoxes();
  const pad=44;
  /* 범위 = 노드 영역 ∪ 현재 뷰포트 → 화면 비율과 동일하게 보이도록 */
  const vpx=-view.x/view.k, vpy=-view.y/view.k, vpw=canvas.clientWidth/view.k, vph=canvas.clientHeight/view.k;
  const minX=Math.min(vpx,...boxes.map(b=>b.x))-pad,minY=Math.min(vpy,...boxes.map(b=>b.y))-pad;
  const maxX=Math.max(vpx+vpw,...boxes.map(b=>b.x+b.w))+pad,maxY=Math.max(vpy+vph,...boxes.map(b=>b.y+b.h))+pad;
  const MW=mmEl.clientWidth,MH=mmEl.clientHeight;
  const mk=Math.min(MW/(maxX-minX),MH/(maxY-minY));
  const offx=(MW-(maxX-minX)*mk)/2-minX*mk;
  const offy=(MH-(maxY-minY)*mk)/2-minY*mk;
  mmMap={mk,offx,offy};
  mmEl.textContent="";
  boxes.forEach(b=>{
    const d=el("div",b.st==="gw"?"mm-gw":"mm-node st-"+b.st);
    d.style.left=(b.x*mk+offx)+"px";d.style.top=(b.y*mk+offy)+"px";
    d.style.width=Math.max(4,b.w*mk)+"px";d.style.height=Math.max(3,b.h*mk)+"px";
    mmEl.append(d);
  });
  const vw=el("div","mm-view");
  vw.style.left=((-view.x/view.k)*mk+offx)+"px";
  vw.style.top=((-view.y/view.k)*mk+offy)+"px";
  vw.style.width=((canvas.clientWidth/view.k)*mk)+"px";
  vw.style.height=((canvas.clientHeight/view.k)*mk)+"px";
  mmEl.append(vw);
}
function mmJump(e){
  if(!mmMap)return;
  const r=mmEl.getBoundingClientRect();
  const wx=(e.clientX-r.left-mmMap.offx)/mmMap.mk;
  const wy=(e.clientY-r.top-mmMap.offy)/mmMap.mk;
  view.x=canvas.clientWidth/2-wx*view.k;
  view.y=canvas.clientHeight/2-wy*view.k;
  touchView();applyView();
}
mmEl.addEventListener("pointerdown",e=>{e.stopPropagation();mmEl.setPointerCapture(e.pointerId);mmJump(e)});
mmEl.addEventListener("pointermove",e=>{if(e.buttons)mmJump(e)});

/* ================= notifications (macOS 방식) ================= */
const N={items:[],dnd:false,open:false,expand:{}};
const NKIND={wait:"응답 대기",err:"중단·오류",done:"완료"};
let nseq=0;
const toastsBox=$("#toasts"),ncEl=$("#notifCenter"),notifBtn=$("#notifBtn");
function notify(kind,t,body){
  const it={id:++nseq,kind,taskId:t.id,title:t.title,body,at:new Date(),loc:N.dnd?"center":"toast",timer:null};
  N.items.push(it);
  renderNotif();
  if(it.loc==="toast")armToast(it);
}
function armToast(it){clearTimeout(it.timer);it.timer=setTimeout(()=>hideToast(it),5000)}
function hideToast(it){ /* 자동 숨김: 삭제가 아니라 보관함으로 이동 */
  it.loc="center";
  const c=document.getElementById("toast-"+it.id);
  if(c){c.classList.add("out");setTimeout(()=>{c.remove();renderNotif()},250)}
  else renderNotif();
}
function dropNotif(it){clearTimeout(it.timer);N.items=N.items.filter(x=>x!==it)}
function withdrawNotif(taskId,kind){ /* 다른 경로로 해소된 알림은 자동 철회 */
  N.items.filter(i=>i.taskId===taskId&&(!kind||i.kind===kind)).forEach(dropNotif);
  renderNotif();
}
function openFromNotif(it){ /* 클릭 = 해당 노드 확인 = 읽음 처리 */
  const t=S.tasks.get(it.taskId);
  dropNotif(it);N.open=false;renderNotif();
  if(t){select(t.id);centerOn(t)}
}
function ncard(it){
  const c=el("div","ncard st-"+it.kind);
  c.setAttribute("role","button");c.tabIndex=0;
  c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();c.click()}});
  const nt=el("div","nt");
  nt.append(el("b",null,it.title),el("time","mono",clock(it.at)));
  const x=el("button","nx","✕");x.setAttribute("aria-label","알림 삭제");
  x.addEventListener("click",e=>{e.stopPropagation();dropNotif(it);renderNotif()});
  c.append(nt,el("div","nb2",it.body),x);
  return c;
}
function renderToasts(){
  const live=N.items.filter(i=>i.loc==="toast");
  while(live.length>3)hideToast(live.shift()); /* 초과분도 동일한 슬라이드-아웃 경로 */
  [...toastsBox.children].forEach(c=>{
    if(!live.some(i=>"toast-"+i.id===c.id)&&!c.classList.contains("out"))c.remove();
  });
  live.slice().reverse().forEach(it=>{
    if(!document.getElementById("toast-"+it.id)){
      const c=ncard(it);c.id="toast-"+it.id;c.classList.add("toast","in");
      c.addEventListener("click",()=>openFromNotif(it));
      c.addEventListener("mouseenter",()=>clearTimeout(it.timer));
      c.addEventListener("mouseleave",()=>armToast(it));
      toastsBox.prepend(c);
      requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.remove("in")));
    }
  });
}
function renderCenter(){
  notifBtn.classList.toggle("has",N.items.length>0);
  notifBtn.querySelector(".nb").textContent=String(N.items.length);
  notifBtn.classList.toggle("dnd",N.dnd);
  $("#ncDnd").checked=N.dnd;
  ncEl.classList.toggle("open",N.open);
  if(!N.open)return;
  const body=ncEl.querySelector(".nc-body");body.textContent="";
  const centerItems=N.items.filter(i=>i.loc==="center");
  if(!centerItems.length){body.append(el("div","nc-empty","새 알림이 없습니다"));return}
  ["wait","err","done"].forEach(k=>{
    const list=centerItems.filter(i=>i.kind===k).sort((a,b)=>b.id-a.id);
    if(!list.length)return;
    const g=el("div","nc-group st-"+k);
    const gh=el("div","nc-gh");
    gh.append(el("i","dot"),el("span",null,NKIND[k]),el("span",null,String(list.length)),el("span","grow"));
    if(list.length>1){
      const fold=el("button","nc-btn",N.expand[k]?"접기":"펼치기");
      fold.addEventListener("click",()=>{N.expand[k]=!N.expand[k];renderNotif()});
      gh.append(fold);
    }
    const clr=el("button","nc-btn","지우기");
    clr.addEventListener("click",()=>{list.forEach(dropNotif);renderNotif()});
    gh.append(clr);
    g.append(gh);
    const expanded=N.expand[k]||list.length===1;
    if(expanded){
      list.forEach(it=>{
        const c=ncard(it);
        c.addEventListener("click",()=>openFromNotif(it));
        g.append(c);
      });
    }else{ /* macOS식 스택: 최신 1장(본문 유지) + 뒤 카드 겹침, 클릭하면 펼침. 삭제는 헤더 '지우기' 한 곳으로 */
      const w=el("div","stack"),c=ncard(list[0]);
      c.querySelector(".nx").remove();
      c.setAttribute("aria-label",NKIND[k]+" 알림 "+list.length+"건 펼치기");
      c.addEventListener("click",()=>{N.expand[k]=true;renderNotif()});
      w.append(c);g.append(w);
    }
    body.append(g);
  });
}

function makeResizer(sel,onMove,onReset){
  const h=document.querySelector(sel);
  h.addEventListener("pointerdown",e=>{e.preventDefault();h.setPointerCapture(e.pointerId);h.classList.add("drag")});
  h.addEventListener("pointermove",e=>{if(h.classList.contains("drag")){onMove(e);applySizes()}});

}

const KEY_DEFAULTS={
  palette:"mod+shift+p",
  toggleSidebar:"mod+b",
  toggleDetail:"mod+alt+b",
  toggleChat:"mod+j",
  chatGrow:"mod+ctrl+arrowup",
  chatShrink:"mod+ctrl+arrowdown",

const IS_MAC=/Mac/i.test(navigator.platform);
function normCombo(s){return String(s).toLowerCase().split("+").map(x=>x.trim()).sort().join("+")}
function eventCombo(e){
  const p=[];
  if(e.metaKey)p.push(IS_MAC?"mod":"meta");
  if(e.ctrlKey)p.push(IS_MAC?"ctrl":"mod");
  if(e.altKey)p.push("alt");
  if(e.shiftKey)p.push("shift");
  const k=e.key.toLowerCase();
  if(!["meta","control","alt","shift"].includes(k))p.push(k);
  return p.sort().join("+");
}
const matchKey=(e,c)=>c&&eventCombo(e)===normCombo(c);
function fmtKey(c){
  if(!c)return"";
  const M={mod:IS_MAC?"⌘":"Ctrl+",ctrl:"⌃",alt:"⌥",shift:"⇧",arrowup:"↑",arrowdown:"↓",arrowleft:"←",arrowright:"→"};
  return String(c).split("+").map(x=>M[x]||x.toUpperCase()).join("");
}

  else if(matchKey(e,KEYS.toggleDetail)){e.preventDefault();togglePanel("dt")}

  const q=palInput.value.trim().toLowerCase();
  PAL.list=commands().filter(c=>!q||q.split(/\s+/).every(n=>c.t.toLowerCase().includes(n)));

// web/src/notify.ts
function diffNotifs(prev, next) {
  const add = [];
  const withdraw = [];
  if (next.parent_uuid || prev.status === next.status)
    return { add, withdraw };
  const u = next.uuid;
  const mk = (kind, body) => add.push({ kind, taskUuid: u, title: next.title, body });
  if (next.status === "closed") {
    withdraw.push({ taskUuid: u });
    return { add, withdraw };
  }
  if (prev.status === "waiting_input")
    withdraw.push({ taskUuid: u, kind: "wait" });
  if (["error", "cancelled", "needs_review"].includes(prev.status) && ["queued", "starting", "running"].includes(next.status))
    withdraw.push({ taskUuid: u, kind: "err" });
  if (next.status === "waiting_input")
    mk("wait", next.question?.text ?? "응답이 필요합니다");
  else if (next.status === "error")
    mk("err", "세션 오류 — 재시작이 필요합니다");
  else if (next.status === "cancelled")
    mk("err", "중단됨");
  else if (next.status === "needs_review")
    mk("err", `검토 필요 — ${next.last_summary ?? ""}`);
  else if (next.status === "done")
    mk("done", next.last_summary ?? "완료");
  return { add, withdraw };
}

// web/src/store.ts
var EVENTS_CAP = 200;
var freshDirty = () => ({ tasks: new Set, messages: new Set, events: new Set, sys: false, projects: false, all: false });
var initial = () => ({ seq: 0, idx: 0, conn: "reconnecting", sys: null, projects: [], tasks: {}, messages: [], events: {}, dirty: freshDirty() });
function createStore() {
  const state = initial();
  const subs = new Set;
  const emit = (frame) => {
    for (const f of subs)
      f(frame);
  };
  const upsertMessage = (m) => {
    const i = state.messages.findIndex((x) => x.id === m.id);
    if (i >= 0)
      state.messages[i] = m;
    else {
      state.messages.push(m);
      state.messages.sort((a, b) => a.created_at - b.created_at || a.id.localeCompare(b.id));
    }
    state.dirty.messages.add(m.id);
  };
  return {
    state,
    subscribe(fn) {
      subs.add(fn);
      return () => {
        subs.delete(fn);
      };
    },
    applyFrame(f) {
      if (f.type !== "hello" && (f.seq < state.seq || f.seq === state.seq && f.idx <= state.idx))
        return;
      if (f.type !== "hello") {
        state.seq = f.seq;
        state.idx = f.idx;
      }
      switch (f.type) {
        case "hello":
        case "system.state":
          state.sys = f.state;
          state.dirty.sys = true;
          break;
        case "projects.updated":
          state.projects = f.projects;
          state.dirty.projects = true;
          break;
        case "chat.message":
        case "dispatch.updated":
          upsertMessage(f.message);
          break;
        case "task.created":
        case "task.updated":
          state.tasks[f.task.uuid] = f.task;
          state.dirty.tasks.add(f.task.uuid);
          break;
        case "task.event": {
          const list = state.events[f.task_uuid] ?? [];
          list.push(f.event);
          if (list.length > EVENTS_CAP)
            list.splice(0, list.length - EVENTS_CAP);
          state.events[f.task_uuid] = list;
          state.dirty.events.add(f.task_uuid);
          break;
        }
      }
      emit(f);
    },
    applySnapshot(s) {
      state.seq = s.as_of_seq;
      state.idx = Number.MAX_SAFE_INTEGER;
      state.sys = s.state;
      state.projects = s.projects;
      state.tasks = Object.fromEntries(s.tasks.map((t) => [t.uuid, t]));
      state.messages = [...s.messages].sort((a, b) => a.created_at - b.created_at || a.id.localeCompare(b.id));
      state.dirty.all = true;
      emit();
    },
    setConn(c) {
      state.conn = c;
      state.dirty.sys = true;
      emit();
    },
    drain() {
      const d = state.dirty;
      state.dirty = freshDirty();
      return d;
    },
    reset() {
      Object.assign(state, initial());
    }
  };
}

    stop: (t) => run("중단", interrupt(t.uuid)),
    restart: (t) => run("재시작", retry(t.uuid)),
    archive: (t) => run("보관", close(t.uuid)),
    attach: async (t) => {
      try {
        const { command } = await attachLease(t.uuid);
        await navigator.clipboard?.writeText(command).catch(() => {});
        note(`클립보드에 복사: ${command} (터미널에서 실행 — 끝나면 relay attach가 lease를 해제)`);
      } catch (e) {
        note(`attach 실패: ${e.message}`);
      }
    },
    pause: () => run("kill switch", S.paused ? resumeAll() : pause()),
    setMax: (n) => run("상한 변경", patchSettings({ max_concurrent_agents: Math.max(1, n) })),
    registerProject: (p) => run("프로젝트 등록", registerProject(p)),
    removeProject: (id) => run("프로젝트 삭제", removeProject(id)),
    redispatch: (messageId) => run("재시도", redispatch(messageId)),
    loadDetail: (t) => {
      if (loadedDetail === t.uuid)
        return;
      loadedDetail = t.uuid;
      taskDetail(t.uuid).then((d) => {
        const live = new Set(t.events.map((e) => e.id));
        t.events = [...d.events.filter((e) => isTimelineEvent(e.type)).map(eventLine).filter((e) => !live.has(e.id)), ...t.events].slice(-200);
        if (S.sel === t.id)
          D.refresh();
      }).catch(() => {});
    }
  };
  D.relay = relay;
  const syncTasks = (uuids) => {
    let changed = false;
    for (const uuid of uuids) {
      const t = store.state.tasks[uuid];
      if (!t)
        continue;
      const next = toDemoTask(t, ctx());
      const cur = S.tasks.get(next.id);
      if (cur)
        Object.assign(cur, next);
      else
        S.tasks.set(next.id, { ...next, events: [], timers: [], x: 0, y: 0 });
      changed = true;
    }
    return changed;
  };
  const syncSystem = () => {
    const sys = store.state.sys;
    if (sys) {
      S.maxw = sys.max_concurrent_agents;
      S.paused = sys.paused;
      S.usage = sys.today_tokens;
      S.running = sys.running;
      S.recovering = sys.recovering;
      S.version = sys.version;
      S.delivery = sys.delivery_method;
      S.dailyCeiling = sys.daily_ceiling;
    }
    S.projects = store.state.projects;
    S.conn = store.state.conn === "resync" ? "replaying" : store.state.conn;
    S.lastSeq = store.state.seq;
    D.renderBanner();
    D.renderSettings();
    D.gwEl.classList.toggle("judging", store.state.messages.some((m) => m.dispatch_state === "deciding"));
    D.gwEl.querySelector(".gw-s").textContent = D.gwEl.classList.contains("judging") ? "dispatcher 판단 중 (fable)" : `:${location.port || 80} · 상시 수신`;
  };
  const badgeRow = (m) => {
    const b = badgeParts(m, ctx());
    const row = D.el("div", "m-badges");
    row.append(D.el("span", "badge k" + (b.judging ? " judging" : ""), b.kind));
    b.parts.forEach((p) => row.append(D.el("span", "badge", p)));
    if (b.task)
      row.append(D.ttagBtn(b.task));
    if (b.retry) {
      const r = D.el("button", "nc-btn", "재시도");
      r.addEventListener("click", () => relay.redispatch(m.id));
      row.append(r);
    }
    return row;
  };
  const syncMessages = (ids) => {
    const byId = new Map(store.state.messages.map((m) => [m.id, m]));
    for (const id of ids) {
      const m = byId.get(id);
      if (!m)
        continue;
      if (isDispatcherBadgeRow(m)) {
        drawn.add(id);
        continue;
      }
      if (drawn.has(id)) {
        const old = badgeRows.get(id);
        if (old && m.role === "user") {
          const fresh = badgeRow(m);
          old.replaceWith(fresh);
          badgeRows.set(id, fresh);
        }
        continue;
      }
      drawn.add(id);
      const task = demoOf(m.task_uuid);
      if (m.role === "user") {
        D.chatUser(m.text);
        const wrap = D.el("div", "m-row");
        const row = badgeRow(m);
        wrap.append(row);
        D.msgs.append(wrap);
        badgeRows.set(id, row);
      } else if (m.role === "question" && task)
        D.chatQuestion(task);
      else if (m.role === "system") {
        const uuid = closeConfirmUuid(m.text);
        if (uuid) {
          const wrap = D.el("div", "m-row");
          wrap.append(D.el("div", "m-sys", m.text.split(" [종료 확인")[0]));
          const b = D.el("button", "act danger", "종료");
          b.addEventListener("click", () => run("종료", close(uuid)));
          wrap.append(b);
          D.msgs.append(wrap);
        } else
          D.chatMsg(task ?? null, m.text);
      } else
        D.chatMsg(task ?? null, m.text);
    }
    D.scrollChat?.();
    const users = store.state.messages.filter((m) => m.role === "user").slice(-20).reverse();
    D.DLOG.length = 0;
    for (const m of users)
      D.DLOG.push(dlogEntry(m, ctx()));
    D.renderDlog();
  };
  const syncEvents = (uuids) => {
    for (const uuid of uuids) {
      const t = demoOf(uuid);
      if (!t)
        continue;
      const list = store.state.events[uuid] ?? [];
      const have = new Set(t.events.map((e) => e.id));
      for (const e of list)
        if (!have.has(e.seq) && isTimelineEvent(e.type))
          t.events.push(eventLine(e));
      if (t.events.length > 200)
        t.events.splice(0, t.events.length - 200);
      if (S.sel === t.id)
        D.refresh();
    }
  };
  const flushNotifs = () => {
    const { ops, chips } = notifs.drain();
    for (const o of ops) {
      const d = demoOf(o.taskUuid);
      if (!d)
        continue;
      if (o.op === "withdraw")
        D.withdrawNotif(d.id, o.kind);
      else
        D.notify(o.kind, d, o.body);
    }
    for (const uuid of chips) {
      const d = demoOf(uuid);
      if (d)
        document.querySelectorAll(`.m-chips[data-task="${d.id}"] .chip`).forEach((b) => b.disabled = true);
    }
  };
  const sync = () => {
    raf = 0;
    const d = store.drain();
    const all = d.all;
    const tasksChanged = syncTasks(all ? Object.keys(store.state.tasks) : d.tasks);
    flushNotifs();
    if (all || d.sys || d.projects)
      syncSystem();
    if (all || d.messages.size)
      syncMessages(all ? store.state.messages.map((m) => m.id) : d.messages);
    if (d.events.size)
      syncEvents(d.events);
    if (tasksChanged || all)
      D.relayout();
  };
  store.subscribe((f) => {
    if (f) {
      if (f.type === "task.created" || f.type === "task.updated")
        notifs.observe(f.task);
    } else
      for (const t of Object.values(store.state.tasks))
        notifs.observe(t);
    if (!raf)
      raf = requestAnimationFrame(sync);
  });
  const origSelect = D.select;
  D.select = (id) => {
    origSelect(id);
    const t = id ? S.tasks.get(id) : null;
    if (t)
      relay.loadDetail(t);
  };
}

// web/src/ws.ts
function connect(opts = {}) {
  const WS = opts.WebSocketImpl ?? WebSocket;
  const f = opts.fetchImpl ?? fetch;
  const token = readToken();
  const tok = encodeURIComponent(token);
  const base = opts.url ?? `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
  let backoff = 1000;
  let first = true;
  const open = () => {
    const ws = new WS(first ? `${base}?token=${tok}` : `${base}?from_seq=${Math.max(0, store.state.seq - 1)}&token=${tok}`);
    let buffering = first;
    const buf = [];
    let asOf = -1;
    ws.onopen = () => {
      backoff = 1000;
    };
    ws.onmessage = async (ev) => {
      const fr = JSON.parse(String(ev.data));
      if (fr.type === "hello") {
        const behind = fr.as_of_seq - store.state.seq;
        store.applyFrame(fr);
        if (first || behind > 5000) {
          buffering = true;
          const r = await f("/api/tasks", { headers: { authorization: `Bearer ${token}` } });
          const snap = await r.json();
          store.applySnapshot(snap);
          for (const b of buf)
            if (b.seq > snap.as_of_seq)
              store.applyFrame(b);
          buf.length = 0;
          buffering = false;
          first = false;
          store.setConn("ok");
        } else if (store.state.seq >= fr.as_of_seq) {
          store.setConn("ok");
        } else {
          asOf = fr.as_of_seq;
          store.setConn("resync");
        }
        return;
      }
      if (buffering)
        buf.push(fr);
      else {
        store.applyFrame(fr);
        if (asOf >= 0 && store.state.seq >= asOf) {
          asOf = -1;
          store.setConn("ok");
        }
      }
    };
    ws.onclose = () => {
      asOf = -1;
      store.setConn("reconnecting");
      setTimeout(open, backoff);
      backoff = Math.min(backoff * 2, 15000);
    };
  };
  open();
}

// web/src/main.ts
installAdapter();
connect();
</script>
